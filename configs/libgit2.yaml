# KNighter on libgit2 (C, CMake): the previous attempt's target, for direct comparison.
result_dir: "results/libgit2"
LLVM_dir: "/home/faris/RA-MrYudis/Knight/KNighter/llvm"
key_file: "llm_keys.yaml"
model: "opencode-go:deepseek-v4.1-flash"
checker_nums: 3
max_tokens: 65536
llm_timeout: 600

project:
  description: "libgit2, a portable C implementation of the Git core methods"

target_type: compiledb
target_options:
  name: libgit2
  repo_dir: "/home/faris/RA-MrYudis/Knight/targets/libgit2"
  work_dir: "/home/faris/RA-MrYudis/Knight/targets/.knighter-work/libgit2"
  setup:
    # Options from the previous attempt (src/targets/cmake.py there); old revisions need them.
    - >-
      cmake -S {src} -B {build} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      -DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_FUZZERS=OFF
      -DUSE_SSH=OFF -DUSE_HTTP=OFF -DUSE_HTTPS=OFF -DUSE_AUTH_NTLM=OFF
      -DUSE_SHA1=CollisionDetection -DUSE_SHA256=Builtin
  source_extensions: [".c"]
  scan_include: ["src/"]

plugin_build: standalone
validation_scoring: strict
analysis_jobs: 8
analysis_timeout: 600
max_parallel_plugin_builds: 4

scan_commit: "HEAD"
min_reports_for_triage: 1
perfect_report_threshold: 3
jobs: 8
