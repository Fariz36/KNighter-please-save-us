# KNighter on Lua (plain hand-written Makefile, in-source build). Third build
# system for the "general C" evidence, next to curl (CMake) and SQLite (autosetup).
result_dir: "results/lua"
LLVM_dir: "/home/faris/RA-MrYudis/Knight/KNighter/llvm"
key_file: "llm_keys.yaml"
model: "opencode-go:deepseek-v4.1-flash"
checker_nums: 3
max_tokens: 65536
llm_timeout: 600

project:
  description: "Lua, a scripting language interpreter and C library written in ANSI C"

target_type: compiledb
target_options:
  name: lua
  repo_dir: "/home/faris/RA-MrYudis/Knight/targets/lua"
  work_dir: "/home/faris/RA-MrYudis/Knight/targets/.knighter-work/lua"
  setup:
    # The makefile builds in the source tree; clean first so every object is
    # recompiled (and therefore recorded), then record the compile commands.
    - "make -C {src} clean"
    - "intercept-build --cdb {build}/compile_commands.json make -C {src} -j{jobs} CC={clang} lua"
  source_extensions: [".c"]

plugin_build: standalone
validation_scoring: strict
analysis_jobs: 8
analysis_timeout: 600
max_parallel_plugin_builds: 4

scan_commit: "HEAD"
min_reports_for_triage: 1
perfect_report_threshold: 3
jobs: 8
