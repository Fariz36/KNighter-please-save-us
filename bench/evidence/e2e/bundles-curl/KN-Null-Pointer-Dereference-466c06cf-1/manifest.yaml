pattern: "## Bug Pattern\n\nThe function dereferences a caller-supplied pointer parameter (`in`) without\
  \ first validating it for NULL. In `curl_url_dup()`, the code unconditionally reads fields such as `in->scheme`\
  \ through the `DUP()` macro and later `in->portnum`, so passing a NULL handle causes a NULL pointer\
  \ dereference. The fix is to check `!in` at function entry and return NULL, matching the API\u2019s\
  \ handling of an invalid or uninitialized handle."
