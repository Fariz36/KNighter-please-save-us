# KNighter on curl (generic compile-DB target). Paths are for this machine.
result_dir: "e2e/refine-curl-t0-run2"
LLVM_dir: "/home/faris/RA-MrYudis/Knight/KNighter/llvm"
key_file: "llm_keys.yaml"
model: "opencode-go:deepseek-v4.1-flash"
checker_nums: 3
# Output budget includes reasoning tokens; 16000 (upstream default) was exhausted
# by reasoning alone in plan2checker (empty content). See docs/RESEARCH_LOG.md.
max_tokens: 65536
llm_timeout: 600

# How prompts name the project ("a patch to <description>").
project:
  description: "curl, the C library (libcurl) for transferring data with URLs"

target_type: compiledb
target_options:
  name: curl
  repo_dir: "/home/faris/RA-MrYudis/Knight/targets/curl"
  work_dir: "/home/faris/RA-MrYudis/Knight/targets/.knighter-work/curl"
  setup:
    - >-
      cmake -S {src} -B {build} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      -DBUILD_TESTING=OFF -DBUILD_CURL_EXE=OFF -DBUILD_EXAMPLES=OFF
      -DBUILD_LIBCURL_DOCS=OFF -DBUILD_MISC_DOCS=OFF -DENABLE_CURL_MANUAL=OFF
      -DCURL_USE_LIBSSH2=OFF -DUSE_LIBIDN2=OFF -DCURL_ZSTD=OFF -DCURL_USE_OPENSSL=ON
  source_extensions: [".c"]
  scan_include: ["lib/"]

# Backend
plugin_build: standalone          # standalone | legacy
validation_scoring: strict        # strict | legacy
analysis_jobs: 8
analysis_timeout: 600
max_parallel_plugin_builds: 4

# Refinement / scanning (small-project scale)
scan_commit: "HEAD"
min_reports_for_triage: 1
perfect_report_threshold: 0
jobs: 8
