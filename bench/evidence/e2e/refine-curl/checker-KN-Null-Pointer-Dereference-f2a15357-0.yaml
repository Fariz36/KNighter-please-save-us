patch: "## Patch Description\n\ncurl_easy_send/recv: check pointer arg\n\nReturn `CURLE_BAD_FUNCTION_ARGUMENT`\
  \ when a `NULL` has been passed as\narg `n`.\n\nReported-by: Joshua Rogers\nCloses\
  \ #23035\n\n## Buggy Code\n\n```c\n// Function: curl_easy_send in lib/easy.c\nCURLcode\
  \ curl_easy_send(CURL *curl, const void *buffer, size_t buflen,\n              \
  \          size_t *n)\n{\n  struct Curl_eapi_guard guard;\n  CURLcode result;\n\n\
  \  if(CURL_EAPI_ENTER(&guard, curl, easy_send, &result)) {\n    struct Curl_easy\
  \ *data = curl;\n    size_t written = 0;\n\n    result = Curl_senddata(data, buffer,\
  \ buflen, &written);\n    *n = written;\n  }\n  CURL_EAPI_LEAVE(&guard);\n  return\
  \ result;\n}\n```\n\n```c\n// Function: curl_easy_recv in lib/easy.c\nCURLcode curl_easy_recv(CURL\
  \ *curl, void *buffer, size_t buflen, size_t *n)\n{\n  struct Curl_eapi_guard guard;\n\
  \  CURLcode result;\n\n  if(CURL_EAPI_ENTER(&guard, curl, easy_recv, &result)) {\n\
  \    result = Curl_easy_recv(curl, buffer, buflen, n);\n  }\n  CURL_EAPI_LEAVE(&guard);\n\
  \  return result;\n}\n```\n\n## Bug Fix Patch\n\n```diff\ndiff --git a/lib/easy.c\
  \ b/lib/easy.c\nindex 721f3a0c7a..115a5f2876 100644\n--- a/lib/easy.c\n+++ b/lib/easy.c\n\
  @@ -1304,8 +1304,13 @@ CURLcode curl_easy_recv(CURL *curl, void *buffer, size_t\
  \ buflen, size_t *n)\n   CURLcode result;\n \n   if(CURL_EAPI_ENTER(&guard, curl,\
  \ easy_recv, &result)) {\n+    if(!n) {\n+      result = CURLE_BAD_FUNCTION_ARGUMENT;\n\
  +      goto out;\n+    }\n     result = Curl_easy_recv(curl, buffer, buflen, n);\n\
  \   }\n+out:\n   CURL_EAPI_LEAVE(&guard);\n   return result;\n }\n@@ -1374,9 +1379,14\
  \ @@ CURLcode curl_easy_send(CURL *curl, const void *buffer, size_t buflen,\n  \
  \   struct Curl_easy *data = curl;\n     size_t written = 0;\n \n+    if(!n) {\n\
  +      result = CURLE_BAD_FUNCTION_ARGUMENT;\n+      goto out;\n+    }\n     result\
  \ = Curl_senddata(data, buffer, buflen, &written);\n     *n = written;\n   }\n+out:\n\
  \   CURL_EAPI_LEAVE(&guard);\n   return result;\n }\n```\n"
pattern: '## Bug Pattern


  Missing NULL validation of a required pointer argument before it is dereferenced
  or written through. In `curl_easy_send()`, `*n` is assigned without checking `n`;
  in `curl_easy_recv()`, `n` is forwarded to a callee that writes through it without
  checking `n`. If the caller passes `NULL`, this causes a NULL pointer dereference.
  The fix validates `n` first and returns `CURLE_BAD_FUNCTION_ARGUMENT`.'
plan: "1. **Register Program State Set:**\n   - Use `REGISTER_SET_WITH_PROGRAMSTATE(CheckedPtrSet,\
  \ const MemRegion *)` to track the `MemRegion` of pointer arguments that have been\
  \ validated as non-NULL. This set is path-sensitive.\n\n2. **Helper Functions:**\n\
  \   - `isTargetFunction(const FunctionDecl *FD)`: returns `true` if `FD` is `curl_easy_send`\
  \ or `curl_easy_recv`.\n   - `isTargetParam(const VarDecl *VD)`: returns `true`\
  \ if `VD` is the 4th parameter (index 3) of a target function (the `n` parameter).\n\
  \   - `getTargetParamRegion(const Expr *E, CheckerContext &C)`: if `E` (ignoring\
  \ implicit casts) is a `DeclRefExpr` to a target parameter, return its `MemRegion`\
  \ using `getMemRegionFromExpr(E, C)`; otherwise return `nullptr`.\n\n3. **`checkBranchCondition`:**\n\
  \   - Hook `check::BranchCondition`.\n   - Analyze the condition to detect NULL\
  \ checks on a target parameter `n` (e.g., `!n`, `n`, `n == NULL`, `n != NULL`, `NULL\
  \ == n`).\n   - If the checked pointer is a target parameter `n`, obtain its `MemRegion`\
  \ and add it to `CheckedPtrSet` in the current state. Call `C.addTransition(NewState)`\
  \ to persist the update.\n\n4. **`checkBind`:**\n   - Hook `check::Bind`.\n   -\
  \ For a store operation (`*n = ...`), the statement `S` is typically a `BinaryOperator`\
  \ with `BO_Assign`, whose left-hand side is a `UnaryOperator` with `UO_Deref` on\
  \ `n`.\n   - Extract the pointer expression from the dereference. If it is a target\
  \ parameter `n`, get its `MemRegion`.\n   - Check if the region is present in `CheckedPtrSet`.\
  \ If not, report a bug: \u201CMissing NULL check for argument 'n' before write.\u201D\
  \n   - Generate a non-fatal error node and emit a `PathSensitiveBugReport` using\
  \ `C.emitReport`.\n\n5. **`checkPreCall`:**\n   - Hook `check::PreCall`.\n   - Use\
  \ `functionKnownToDeref(Call, DerefParams)` to obtain the list of parameter indices\
  \ that the callee is known to dereference.\n   - For each such index `i`, retrieve\
  \ the argument expression `Call.getArgExpr(i)`. If it is a target parameter `n`,\
  \ get its `MemRegion`.\n   - If the region is not in `CheckedPtrSet`, report a bug:\
  \ \u201CMissing NULL check for argument 'n' before passing to a function that dereferences\
  \ it.\u201D\n   - Generate a non-fatal error node and emit a `PathSensitiveBugReport`.\n\
  \n6. **Bug Reporting:**\n   - In both `checkBind` and `checkPreCall`, create a `PathSensitiveBugReport`\
  \ with a concise message (e.g., \u201CMissing NULL check for pointer argument 'n'.\u201D\
  ) and emit it via `C.emitReport`."
