pattern: '## Bug Pattern


  Treating an explicitly length-delimited buffer returned by OpenSSL ASN1 string APIs
  (`ASN1_STRING_get0_data()` / `ASN1_STRING_to_UTF8()`) as a NUL-terminated C string.
  The code uses `strlen()` and `%s` on `cn` even though `cn` may not have a terminating
  NUL within `cnlen`, causing out-of-bounds reads and incorrect matching/printing.
  The fix uses length-bounded operations: `memchr(cn, ''\0'', cnlen)` and `%.*s` with
  `cnlen`.'
plan: "1. **Register Program State Map:**\n   - Use `REGISTER_MAP_WITH_PROGRAMSTATE(ASN1LenBufferMap,\
  \ const MemRegion *, bool)` to track memory regions that originate from ASN1 length-delimited\
  \ APIs. Presence of a region in this map means it is a length-delimited buffer that\
  \ may not be NUL-terminated.\n   - Tracking `MemRegion` automatically handles aliases,\
  \ so no separate alias map is required.\n\n2. **Implement Helper Functions:**\n\
  \   - `isASN1Get0Data`, `isASN1ToUTF8`, `isStrlen`, `isPrintfLike` to match callee\
  \ names.\n   - `getFormatArgIndex` to return the format string argument index for\
  \ known printf-like functions (e.g., `0` for `printf`, `1` for `fprintf`, `failf`,\
  \ `infof`).\n   - A simple format-string parser that iterates over `%s` specifiers,\
  \ determines whether a specifier lacks a precision (i.e., no `.` before `s`), and\
  \ computes the corresponding variadic argument index.\n\n3. **Model ASN1 APIs in\
  \ `evalCall`:**\n   - If the call is `ASN1_STRING_get0_data`:\n     - Conjure a\
  \ symbolic heap region for the returned buffer using `getConjuredHeapSymbolVal`.\n\
  \     - Bind the call\u2019s return expression to `loc::MemRegionVal(BufferRegion)`.\n\
  \     - Mark `BufferRegion` in `ASN1LenBufferMap`.\n     - Add transition and return\
  \ `true`.\n   - If the call is `ASN1_STRING_to_UTF8`:\n     - Get the first argument\
  \ expression (e.g., `&cn`) and its `SVal` (a `Loc` for the pointer variable).\n\
  \     - Conjure a symbolic heap region `BufferRegion` for the output buffer.\n \
  \    - Bind the pointer variable to `BufferRegion` via `State->bindLoc(OutLoc, loc::MemRegionVal(BufferRegion),\
  \ C.getLocationContext())`.\n     - Mark `BufferRegion` in `ASN1LenBufferMap`.\n\
  \     - Bind the call\u2019s return value to a conjured symbolic integer (the length).\n\
