patch: "## Patch Description\n\nsetopt: return error if received `curl_blob->data`\
  \ is NULL\n\nTo avoid dereferencing in the function if `CURL_BLOB_COPY` is set,\
  \ or\noutside of the function if unset.\n\nReported-by: netspacer.research\n\nCloses\
  \ #22129\n\n## Buggy Code\n\n```c\n// Function: Curl_setblobopt in lib/setopt.c\n\
  CURLcode Curl_setblobopt(struct curl_blob **blobp,\n                         const\
  \ struct curl_blob *blob)\n{\n  /* free the previous storage at `blobp' and replace\
  \ by a dynamic storage\n     copy of blob. If CURL_BLOB_COPY is set, the data is\
  \ copied. */\n\n  curlx_safefree(*blobp);\n\n  if(blob) {\n    struct curl_blob\
  \ *nblob;\n    if(!blob->len || (blob->len > CURL_MAX_INPUT_LENGTH))\n      return\
  \ CURLE_BAD_FUNCTION_ARGUMENT;\n    nblob = (struct curl_blob *)\n      curlx_malloc(sizeof(struct\
  \ curl_blob) +\n                   ((blob->flags & CURL_BLOB_COPY) ? blob->len :\
  \ 0));\n    if(!nblob)\n      return CURLE_OUT_OF_MEMORY;\n    *nblob = *blob;\n\
  \    if(blob->flags & CURL_BLOB_COPY) {\n      /* put the data after the blob struct\
  \ in memory */\n      nblob->data = (char *)nblob + sizeof(struct curl_blob);\n\
  \      memcpy(nblob->data, blob->data, blob->len);\n    }\n\n    *blobp = nblob;\n\
  \    return CURLE_OK;\n  }\n\n  return CURLE_OK;\n}\n```\n\n## Bug Fix Patch\n\n\
  ```diff\ndiff --git a/lib/setopt.c b/lib/setopt.c\nindex df054469d4..eb9ff2e396\
  \ 100644\n--- a/lib/setopt.c\n+++ b/lib/setopt.c\n@@ -108,7 +108,7 @@ CURLcode Curl_setblobopt(struct\
  \ curl_blob **blobp,\n \n   if(blob) {\n     struct curl_blob *nblob;\n-    if(!blob->len\
  \ || (blob->len > CURL_MAX_INPUT_LENGTH))\n+    if(!blob->data || !blob->len ||\
  \ (blob->len > CURL_MAX_INPUT_LENGTH))\n       return CURLE_BAD_FUNCTION_ARGUMENT;\n\
  \     nblob = (struct curl_blob *)\n       curlx_malloc(sizeof(struct curl_blob)\
  \ +\n```\n"
pattern: '## Bug Pattern


  The code validates the input length (`blob->len`) but does not validate the input
  data pointer (`blob->data`) before using it. When `CURL_BLOB_COPY` is set, `memcpy(nblob->data,
  blob->data, blob->len)` dereferences `blob->data`; if it is NULL while `len` is
  nonzero, this causes a NULL pointer dereference. When `CURL_BLOB_COPY` is unset,
  the unchecked NULL pointer is stored in `nblob->data` and can be dereferenced later
  outside the function.


  The bug pattern is missing NULL validation of a caller-supplied data pointer before
  copying it or passing it on for later use.'
plan: "1. **No Program State Customization Needed:**\n   - The missing NULL validation\
  \ can be detected by inspecting the AST of the `if` condition inside the target\
  \ function. Therefore, no `REGISTER_MAP_WITH_PROGRAMSTATE` or `REGISTER_TRAIT_WITH_PROGRAMSTATE`\
  \ is required.\n\n2. **Callback Function: `checkBranchCondition`**\n   - This callback\
  \ is invoked for every branch condition. Use it to examine the `if` statement in\
  \ `Curl_setblobopt`.\n   - **Step-by-step implementation:**\n     1. Obtain the\
  \ current function declaration via `C.getLocationContext()->getDecl()`. If it is\
  \ not a `FunctionDecl` or its name is not `Curl_setblobopt`, return immediately.\n\
  \     2. The `Condition` parameter holds the expression of the `if` statement.\n\
  \     3. Use the utility `ExprHasName(Condition, \"blob->len\", C)` to check whether\
  \ the condition involves the `blob->len` field. If it returns `false`, this is not\
  \ the target condition; return.\n     4. Use `ExprHasName(Condition, \"blob->data\"\
  , C)` to check whether the condition also validates `blob->data`. If it returns\
  \ `true`, the required NULL check is present; return.\n     5. If the condition\
  \ mentions `blob->len` but not `blob->data`, the bug pattern is present. Generate\
  \ a non-fatal error node using `C.generateNonFatalErrorNode()`.\n     6. Create\
  \ a `PathSensitiveBugReport` with a short message, e.g., `\"Missing NULL check for\
  \ blob->data\"`, and emit it via `C.emitReport(std::move(R))`.\n\n3. **Reporting:**\n\
  \   - The report should be placed at the location of the `if` condition. Keep the\
  \ message concise and clear as indicated in the suggestions."
