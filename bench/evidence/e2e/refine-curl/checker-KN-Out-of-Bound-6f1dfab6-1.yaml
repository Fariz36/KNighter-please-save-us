patch: "## Patch Description\n\nftp: avoid accessing EPSV response one byte past the\
  \ NULL\n\nIf the response is just a single \"(\".\n\nReported-by: Andrew Nesbit\n\
  Closes #21545\n\n## Buggy Code\n\n```c\n// Function: ftp_state_pasv_resp in lib/ftp.c\n\
  static CURLcode ftp_state_pasv_resp(struct Curl_easy *data,\n                  \
  \                  struct ftp_conn *ftpc,\n                                    int\
  \ ftpcode)\n{\n  struct connectdata *conn = data->conn;\n  CURLcode result;\n  const\
  \ struct pingpong *pp = &ftpc->pp;\n  char *newhost = NULL;\n  unsigned short newport\
  \ = 0;\n  const char *str = curlx_dyn_ptr(&pp->recvbuf) + 4; /* start on the first\n\
  \                                                        letter */\n  if((ftpc->count1\
  \ == 0) &&\n     (ftpcode == 229)) {\n    /* positive EPSV response */\n    const\
  \ char *ptr = strchr(str, '(');\n    if(ptr) {\n      char sep;\n      ptr++;\n\
  \      /* |||12345| */\n      sep = ptr[0];\n      if((ptr[1] == sep) && (ptr[2]\
  \ == sep) && ISDIGIT(ptr[3])) {\n        const char *p = &ptr[3];\n        curl_off_t\
  \ num;\n        if(curlx_str_number(&p, &num, 0xffff) || (*p != sep)) {\n      \
  \    failf(data, \"Illegal port number in EPSV reply\");\n          return CURLE_FTP_WEIRD_PASV_REPLY;\n\
  \        }\n        newport = (unsigned short)num;\n        result = ftp_control_addr_dup(data,\
  \ &newhost);\n        if(result)\n          return result;\n      }\n      else\n\
  \        ptr = NULL;\n    }\n    if(!ptr) {\n      failf(data, \"Weirdly formatted\
  \ EPSV reply\");\n      return CURLE_FTP_WEIRD_PASV_REPLY;\n    }\n  }\n  else if((ftpc->count1\
  \ == 1) &&\n          (ftpcode == 227)) {\n    /* positive PASV response */\n  \
  \  unsigned int ip[6];\n\n    /*\n     * Scan for a sequence of six comma-separated\
  \ numbers and use them as\n     * IP+port indicators.\n     *\n     * Found reply-strings\
  \ include:\n     * \"227 Entering Passive Mode (127,0,0,1,4,51)\"\n     * \"227\
  \ Data transfer will passively listen to 127,0,0,1,4,51\"\n     * \"227 Entering\
  \ passive mode. 127,0,0,1,4,51\"\n     */\n    while(*str) {\n      if(match_pasv_6nums(str,\
  \ ip))\n        break;\n      str++;\n    }\n\n    if(!*str) {\n      failf(data,\
  \ \"Could not interpret the 227-response\");\n      return CURLE_FTP_WEIRD_227_FORMAT;\n\
  \    }\n\n    /* we got OK from server */\n    if(data->set.ftp_skip_ip) {\n   \
  \   /* told to ignore the remotely given IP but instead use the host we used\n \
  \        for the control connection */\n      infof(data, \"Skip %u.%u.%u.%u for\
  \ data connection, reuse %s instead\",\n            ip[0], ip[1], ip[2], ip[3],\
  \ conn->origin->hostname);\n      result = ftp_control_addr_dup(data, &newhost);\n\
  \      if(result)\n        return result;\n    }\n    else\n      newhost = curl_maprintf(\"\
  %u.%u.%u.%u\", ip[0], ip[1], ip[2], ip[3]);\n\n    if(!newhost)\n      return CURLE_OUT_OF_MEMORY;\n\
  \n    newport = (unsigned short)(((ip[4] << 8) + ip[5]) & 0xffff);\n  }\n  else\
  \ if(ftpc->count1 == 0) {\n    /* EPSV failed, move on to PASV */\n    return ftp_epsv_disable(data,\
  \ ftpc, conn);\n  }\n  else {\n    failf(data, \"Bad PASV/EPSV response: %03d\"\
  , ftpcode);\n    return CURLE_FTP_WEIRD_PASV_REPLY;\n  }\n\n  DEBUGASSERT(newhost);\n\
  \  Curl_peer_unlink(&conn->origin2);\n  result = Curl_peer_create(data, conn->scheme,\
  \ newhost, newport,\n                            &conn->origin2);\n  if(result)\n\
  \    goto error;\n\n  /* If FIRSTSOCKET goes via another peer, SECONDARY needs as\
  \ well,\n   * but with its new port. */\n  if(conn->via_peer) {\n    Curl_peer_unlink(&conn->via_peer2);\n\
  \    result = Curl_peer_create(data, conn->via_peer->scheme,\n                 \
  \             conn->via_peer->hostname, newport,\n                             \
  \ &conn->via_peer2);\n    if(result)\n      goto error;\n  }\n\n  result = Curl_conn_setup(data,\
  \ conn, SECONDARYSOCKET,\n                           conn->bits.ftp_use_data_ssl\
  \ ?\n                           CURL_CF_SSL_ENABLE : CURL_CF_SSL_DISABLE);\n\n \
  \ if(result) {\n    if((result != CURLE_OUT_OF_MEMORY) &&\n       (ftpc->count1\
  \ == 0) && (ftpcode == 229)) {\n      result = ftp_epsv_disable(data, ftpc, conn);\n\
  \    }\n    goto error;\n  }\n\n  /*\n   * When this is used from the multi interface,\
  \ this might have returned with\n   * the 'connected' set to FALSE and thus we are\
  \ now awaiting a non-blocking\n   * connect to connect.\n   */\n\n#ifdef CURLVERBOSE\n\
  \  if(data->set.verbose) {\n    /* Dump information about this second connection\
  \ when we have issued\n     * a PASV command. */\n    infof(data, \"Connecting to\
  \ %s port %d\",\n          conn->origin2->hostname, conn->origin2->port);\n  }\n\
  #endif\n\n  conn->bits.do_more = TRUE;\n  ftp_state(data, ftpc, FTP_STOP); /* this\
  \ phase is completed */\n\nerror:\n  curlx_free(newhost);\n  return result;\n}\n\
  ```\n\n## Bug Fix Patch\n\n```diff\ndiff --git a/lib/ftp.c b/lib/ftp.c\nindex 17cedb3353..3f55f68d82\
  \ 100644\n--- a/lib/ftp.c\n+++ b/lib/ftp.c\n@@ -2073,7 +2073,7 @@ static CURLcode\
  \ ftp_state_pasv_resp(struct Curl_easy *data,\n       ptr++;\n       /* |||12345|\
  \ */\n       sep = ptr[0];\n-      if((ptr[1] == sep) && (ptr[2] == sep) && ISDIGIT(ptr[3]))\
  \ {\n+      if(sep && (ptr[1] == sep) && (ptr[2] == sep) && ISDIGIT(ptr[3])) {\n\
  \         const char *p = &ptr[3];\n         curl_off_t num;\n         if(curlx_str_number(&p,\
  \ &num, 0xffff) || (*p != sep)) {\n```\n"
pattern: '## Bug Pattern


  Out-of-bounds read when parsing a C string after finding a delimiter: the code increments
  past the delimiter and then indexes `ptr[1]`, `ptr[2]`, `ptr[3]` without first checking
  that `ptr[0]` is non-NUL. If the response ends immediately after the delimiter,
  `ptr` points at the terminating NUL and the fixed-offset reads access memory past
  the end of the string/buffer. The root cause is missing validation that enough characters
  remain before doing fixed-offset lookahead.'
plan: "1. **Program State:**\n   - No custom program state is necessary. The bug pattern\
  \ is a local AST pattern inside one branch condition and its preceding statements.\
  \ Alias tracking and path-sensitive value tracking are not needed.\n\n2. **Bug Type\
  \ Registration:**\n   - In the checker constructor, register a `BugType` for the\
  \ report, e.g. `\"Out-of-bounds read after delimiter\"`.\n\n3. **Implement `checkBranchCondition`:**\n\
  \   - **Step 3.1:** Only handle conditions that belong to an `IfStmt`. Use `findSpecificTypeInParents<IfStmt>(Condition,\
  \ C)`. If no enclosing `IfStmt` is found, return.\n   - **Step 3.2:** Traverse the\
  \ condition AST to collect unsafe fixed-offset reads. For every `ArraySubscriptExpr`:\n\
  \     - Get the base after `IgnoreParenImpCasts()`.\n     - If the base is a `DeclRefExpr`\
  \ to a pointer `VarDecl *P`, evaluate the index using `EvaluateExprToInt`.\n   \
  \  - If the index is a constant `N > 0` (especially `1`, `2`, or `3`), record `(P,\
  \ N, ArraySubscriptExpr*)`.\n   - **Step 3.3:** For each collected base pointer\
  \ `P`, verify it matches the bug pattern:\n     - Get the enclosing `FunctionDecl`\
  \ from `C.getLocationContext()->getDecl()`.\n     - Traverse its body and search\
  \ for a prior call to `strchr`, `strrchr`, or `memchr` whose result is assigned/initialized\
  \ to `P`.\n     - Search for a prior increment of `P` (`P++`, `++P`, or `P = P +\
  \ 1`) before the current `IfStmt`.\n     - If either the delimiter-search assignment\
  \ or the increment is missing, skip `P`.\n   - **Step 3.4:** Find the delimiter-character\
  \ variable `S` if it exists:\n     - Search prior statements for an assignment or\
  \ initialization like `S = P[0]` or `char S = P[0]`.\n   - **Step 3.5:** Check whether\
  \ the condition guards `P` before the fixed-offset reads:\n     - Flatten the condition\u2019\
  s top-level `&&` chain into operands in evaluation order.\n     - Maintain `Guarded\
  \ = false`.\n     - For each operand:\n       - If the operand is a boolean test\
  \ of `S` or `P[0]` (e.g. `S`, `S != 0`, `P[0]`), set `Guarded = true`.\n       -\
  \ If the operand contains any recorded unsafe access for `P` and `Guarded` is still\
  \ `false`, report on that access and stop processing `P`.\n   - **Step 3.6:** Report\
  \ the bug:\n     - Generate a non-fatal error node using `C.generateNonFatalErrorNode()`.\n\
  \     - Create a `PathSensitiveBugReport` with a short message such as `\"Out-of-bounds\
  \ read after strchr delimiter\"`.\n     - Add the source range of the offending\
  \ `ArraySubscriptExpr`.\n     - Emit the report with `C.emitReport(std::move(R))`.\n\
  \n4. **False-Positive Control:**\n   - Only report when the pointer is confirmed\
  \ to come from `strchr`/`strrchr`/`memchr` and is incremented.\n   - Only report\
  \ offsets `> 0`.\n   - Do not report if the condition already checks `P[0]` or its\
  \ saved delimiter `S` before the unsafe fixed-offset access.\n   - `checkBind` and\
