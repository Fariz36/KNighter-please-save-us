  \ {\n+      if(sep && (ptr[1] == sep) && (ptr[2] == sep) && ISDIGIT(ptr[3])) {\n\
  \         const char *p = &ptr[3];\n         curl_off_t num;\n         if(curlx_str_number(&p,\
  \ &num, 0xffff) || (*p != sep)) {\n```\n"
pattern: '## Bug Pattern


  The code performs lookahead reads (`ptr[1]`, `ptr[2]`, `ptr[3]`) immediately after
  advancing past a delimiter `''(''`, without first checking whether the current character
  (`ptr[0]`) is the NUL terminator. If the response ends right after `''(''`, `sep`
  is `''\0''`, and the first comparison reads `ptr[1]`, i.e. one byte past the NUL
  terminator, causing an out-of-bounds read. The fix is to short-circuit when `sep`
  is zero before accessing subsequent bytes.'
plan: "## Plan\n\n1. **Program State**\n   - No custom program state is needed. The\
  \ bug is a local syntactic pattern inside a single `if` condition and its preceding\
  \ assignment. No alias tracking or path-sensitive value propagation is required.\n\
  \n2. **Hook `checkBranchCondition`**\n   - Implement `checkBranchCondition(const\
  \ Stmt *Condition, CheckerContext &C)`.\n   - Normalize `Condition` by ignoring\
  \ parentheses and implicit casts.\n   - Only proceed if the normalized expression\
  \ is a logical AND (`BinaryOperator` with `BO_LAnd`). Flatten all operands connected\
  \ by `&&` into an ordered list.\n\n3. **Find the Dangerous Lookahead Comparison**\n\
  \   - Scan the flattened `&&` operands for a comparison where one side is `ptr[1]`\
  \ and the other side is a variable `sep`.\n   - Specifically match a `BinaryOperator`\
  \ with `BO_EQ` where:\n     - One operand is an `ArraySubscriptExpr` with base `DeclRefExpr`\
  \ to some pointer variable `PtrVD` and index evaluated to `1`.\n     - The other\
  \ operand is a `DeclRefExpr` to a variable `SepVD`.\n   - If this comparison is\
  \ not found, return.\n\n4. **Verify the Pattern Context**\n   - Use `findSpecificTypeInParents<IfStmt>(Condition,\
  \ C)` to get the enclosing `IfStmt` of this condition.\n   - Use `findSpecificTypeInParents<CompoundStmt>(IfStmt,\
  \ C)` to get the compound statement containing that `IfStmt`.\n   - Walk backwards\
  \ from the `IfStmt` in the compound body to find the most recent assignment to `SepVD`.\n\
  \   - Check that the assignment is `sep = ptr[0]` (or a declaration initialized\
  \ with `ptr[0]`) using the same `PtrVD`.\n   - If this context is not found, return\
  \ to avoid false positives.\n\n5. **Check for a Missing NUL Guard**\n   - In the\
  \ flattened `&&` operand list, locate the index of the `ptr[1] == sep` comparison.\n\
  \   - For all operands before that index, check whether any is a non-zero check\
  \ of `SepVD`:\n     - `sep` used directly as a condition\n     - `sep != 0`, `0\
  \ != sep`\n     - `sep != '\\0'`, `'\\0' != sep`\n     - Equivalent comparisons\
  \ that guarantee `sep` is not the NUL terminator\n   - If such a guard exists before\
  \ the dangerous comparison, return as safe.\n   - Otherwise, continue to report.\n\
  \n6. **Report the Bug**\n   - Generate a non-fatal error node at the dangerous `ptr[1]`\
  \ expression or at the enclosing condition.\n   - Create a `PathSensitiveBugReport`\
  \ with a short message such as:\n     - `\"Out-of-bounds read: missing NUL check\
  \ before lookahead\"`\n   - Optionally add a note pointing to the `ptr[1]` subscript.\n\
  \n7. **Helper Functions to Implement**\n   - `isArraySubscriptOf(E, VD, Index, C)`:\
  \ ignore casts; match `ArraySubscriptExpr` with base `DeclRefExpr` to `VD` and index\
  \ evaluated to `Index` using `EvaluateExprToInt`.\n   - `getSepAndPtrFromComparison(E,\
  \ SepVD, PtrVD, C)`: match `BO_EQ`; check one side is `ptr[1]`, the other is `DeclRefExpr`\
  \ to `sep`.\n   - `isGuardForVar(E, VD, C)`: match `sep` alone or comparisons with\
  \ `0` / `'\\0'` that ensure non-zero.\n   - `isAssignmentFromPtrZero(S, SepVD, PtrVD,\
  \ C)`: match `sep = ptr[0]` or `char sep = ptr[0]` using the same pointer variable."
