pattern: "## Bug Pattern\n\nThe caller invokes a `deallocator` on the same resource that was passed to\
  \ a `parser_input` constructor after that constructor returned `null_on_failure`. The constructor consumes\
  \ the buffer and already frees it on its failure path, so the caller\u2019s additional `deallocator`\
  \ call frees the same buffer twice.\n\nRoles:\n- `parser_input`: `xmlNewIOInputStream` \u2014 builds\
  \ a parser input from the supplied buffer and consumes that buffer.\n- `null_on_failure`: `xmlNewIOInputStream`\
  \ \u2014 returns NULL on failure after freeing the consumed buffer.\n- `deallocator`: `xmlFreeParserInputBuffer`\
  \ \u2014 frees the parser input buffer."
roles:
  parser_input:
    names:
    - xmlNewIOInputStream
    description: builds a parser input from a supplied buffer and consumes that buffer
  null_on_failure:
    names:
    - xmlNewIOInputStream
    description: may return NULL on failure after freeing the consumed buffer
  deallocator:
    names:
    - xmlFreeParserInputBuffer
    description: frees a parser input buffer
