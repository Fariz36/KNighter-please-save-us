pattern: '## Bug Pattern


  A `duplicator` dereferences the fields of its source object pointer through a field-copying macro before
  checking whether the source pointer is NULL. The destination `allocator` result is checked, but the
  source argument is not. Passing NULL to the `duplicator` therefore causes a NULL-pointer dereference.


  Roles:

  - `duplicator`: `curl_url_dup`, `DUP`

  - `allocator`: `curlx_calloc`'
roles:
  duplicator:
    names:
    - curl_url_dup
    - DUP
    description: function or macro that creates a copy of a source object; it must not dereference the
      source pointer before verifying it is non-null
  allocator:
    names:
    - curlx_calloc
    description: function that allocates memory and returns a pointer or NULL on failure
portable: true
