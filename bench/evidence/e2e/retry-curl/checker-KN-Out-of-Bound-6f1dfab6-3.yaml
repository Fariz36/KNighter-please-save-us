  \ ftp_state_pasv_resp(struct Curl_easy *data,\n       ptr++;\n       /* |||12345|\
  \ */\n       sep = ptr[0];\n-      if((ptr[1] == sep) && (ptr[2] == sep) && ISDIGIT(ptr[3]))\
  \ {\n+      if(sep && (ptr[1] == sep) && (ptr[2] == sep) && ISDIGIT(ptr[3])) {\n\
  \         const char *p = &ptr[3];\n         curl_off_t num;\n         if(curlx_str_number(&p,\
  \ &num, 0xffff) || (*p != sep)) {\n```\n"
pattern: '## Bug Pattern


  Parsing a string by loading a delimiter byte (`sep = ptr[0]`) and then unconditionally
  reading fixed lookahead bytes (`ptr[1]`, `ptr[2]`, `ptr[3]`) without first checking
  that `sep` is not the NUL terminator. If the string ends immediately after an opening
  `(`, `ptr` points at `\0`, so the subsequent indexing reads past the NUL terminator,
  causing an out-of-bounds read. The fix adds `sep && ...` to guard the lookahead.'
plan: "## Plan\n\n1. **Program State**\n   - Register a map to track delimiter assignments:\n\
  \     ```cpp\n     REGISTER_MAP_WITH_PROGRAMSTATE(DelimiterMap, const MemRegion\
  \ *, const MemRegion *)\n     ```\n   - The key is the `MemRegion` of the delimiter\
  \ variable (e.g., `sep`).\n   - The value is the `MemRegion` of the pointer variable\
  \ (e.g., `ptr`) from which `sep` was loaded as `ptr[0]`.\n   - This state is necessary\
  \ to confirm that the `sep` used in the condition originates from the same `ptr`\
  \ that is later indexed with `1`, `2`, `3`.\n\n2. **Track Delimiter Assignment (`checkBind`)**\n\
  \   - In `checkBind(SVal Loc, SVal Val, const Stmt *S, CheckerContext &C)`:\n  \
  \   - Check if `S` is an assignment (`BinaryOperator` with `BO_Assign`) or a `DeclStmt`\
  \ with an initializer.\n     - Extract the LHS region (`Loc`) and the RHS expression.\n\
  \     - If the RHS is an `ArraySubscriptExpr` with index `0` (or an equivalent pointer\
  \ dereference like `*ptr`), get the base pointer expression.\n     - Evaluate the\
  \ base pointer expression to obtain its `MemRegion`.\n     - Update the state: `State\
  \ = State->set<DelimiterMap>(LHSRegion, BaseRegion)`.\n     - Return the updated\
  \ state.\n\n3. **Detect Missing Guard (`checkBranchCondition`)**\n   - In `checkBranchCondition(const\
  \ Stmt *Condition, CheckerContext &C)`:\n     - Analyze the condition `Condition`\
  \ for the pattern:\n       - A logical AND chain (`&&`) that contains:\n       \
  \  - `ptr[1] == sep` (or `sep == ptr[1]`)\n         - `ptr[2] == sep` (or `sep ==\
  \ ptr[2]`)\n         - An access to `ptr[3]` (e.g., `isdigit(ptr[3])` or `ISDIGIT(ptr[3])`)\n\
  \       - All these must use the same base pointer `ptr`.\n     - Extract the `MemRegion`\
  \ of `sep` and the `MemRegion` of `ptr`.\n     - Look up `DelimiterMap` in the current\
  \ state. If `DelimiterMap[sepRegion] != ptrRegion`, abort (not the target pattern).\n\
  \     - Check whether the condition already guards `sep`:\n       - A standalone\
  \ use of `sep` as a boolean operand (e.g., `sep && ...`).\n       - A comparison\
  \ `sep != 0`, `sep != '\\0'`, or `sep > 0`.\n       - If any such guard exists,\
  \ abort.\n     - If all conditions are met, report the bug.\n\n4. **Report Bug**\n\
  \   - Generate a non-fatal error node using `C.generateNonFatalErrorNode()`.\n \
  \  - Create a `PathSensitiveBugReport` with the short message:\n     `\"Missing\
  \ NUL check on delimiter before lookahead reads\"`\n   - Emit the report via `C.emitReport(...)`."
