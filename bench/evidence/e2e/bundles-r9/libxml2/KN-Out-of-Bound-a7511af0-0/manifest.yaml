pattern: "## Bug Pattern\n\nThe bug pattern is an unchecked indexed read from a parser input buffer. An\
  \ accessor macro dereferences `buffer[current + index]` without verifying that the resulting offset\
  \ is within the buffer\u2019s valid length. When the parser cursor is near the end of the input, a lookahead\
  \ index can read past the allocated string, causing an out-of-bounds read.\n\nRoles:\n- `indexed_read`:\
  \ `NXT` (expands to `ctxt->cur[index]`)\n- `length_of`: `strlen` (used to compute `ctxt->len`, which\
  \ the fixed macro compares against)"
roles:
  indexed_read:
    names:
    - NXT
    description: Macro that performs an indexed read from a buffer; its expansion must verify the index
      is within the buffer's valid length.
  length_of:
    names:
    - strlen
    description: Function that returns the length of a string, used to compute a buffer's valid length.
